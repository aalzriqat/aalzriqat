<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Abdulkareem Alzriqat — Full-stack engineer, TypeScript">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#8c959f"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="78%"  stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>

    <mask id="fademask">
      <rect x="600" y="0" width="600" height="280" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="1200" height="280" fill="#ffffff"/>
  <rect x="600" y="0" width="600" height="280" fill="url(#dots)" mask="url(#fademask)"/>

  <g opacity="0.75">
    <circle cx="1020" cy="140" r="150" fill="none" stroke="#e4e8ed" stroke-width="1"/>
    <circle cx="1020" cy="140" r="104" fill="none" stroke="#e4e8ed" stroke-width="1"/>
    <circle cx="1020" cy="140" r="58"  fill="none" stroke="#e4e8ed" stroke-width="1"/>
  </g>
  <circle cx="1020" cy="140" r="4" fill="url(#accent)"/>

  <rect x="72" y="64" width="64" height="4" rx="2" fill="url(#accent)"/>

  <text x="72" y="134"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" letter-spacing="-1.4" fill="#1f2328">Abdulkareem Alzriqat</text>

  <line x1="72" y1="162" x2="600" y2="162" stroke="#d1d9e0" stroke-width="1"/>

  <text x="72" y="198"
        font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace"
        font-size="14" letter-spacing="3.2" fill="#59636e">FULL-STACK ENGINEER &#183; TYPESCRIPT &#183; MULTI-TENANT SAAS</text>

  <text x="72" y="236"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="19" fill="#4a5259">I design the data model, build the backend, and ship the web and mobile clients.</text>
</svg>
